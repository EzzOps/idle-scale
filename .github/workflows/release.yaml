name: Release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  packages: write
env:
  REGISTRY: ghcr.io
  CONTROLLER_IMAGE: ghcr.io/ezzops/idle-scale-controller
  SENTINEL_IMAGE: ghcr.io/ezzops/idle-scale-sentinel
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Set version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push controller
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.controller
          push: true
          tags: |
            ${{ env.CONTROLLER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.CONTROLLER_IMAGE }}:latest
      - name: Build and push sentinel
      - name: Build and push agent
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.agent
          push: true
          tags: |
            ghcr.io/ezzops/idle-scale-agent:latest
            ghcr.io/ezzops/idle-scale-agent:${{ steps.version.outputs.VERSION }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.sentinel
          push: true
          tags: |
            ${{ env.SENTINEL_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ env.SENTINEL_IMAGE }}:latest
      - name: Package Helm chart
        run: |
          sed -i "s/version:.*/version: ${{ steps.version.outputs.VERSION }}/" charts/idle-scale/Chart.yaml
          sed -i "s/appVersion:.*/appVersion: \"${{ steps.version.outputs.VERSION }}\"/" charts/idle-scale/Chart.yaml
          helm package charts/idle-scale -d dist/
          helm repo index dist/ --url https://ezzops.github.io/idle-scale/charts
      - name: Deploy Helm repo to Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: charts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tgz
          generate_release_notes: true
