name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: Build controller
        run: go build -ldflags="-s -w" -trimpath -o bin/controller ./cmd/main.go
      - name: Build sentinel
        run: go build -ldflags="-s -w" -trimpath -o bin/sentinel ./cmd/sentinel/main.go
      - name: Verify builds
        run: ls -lh bin/
