name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install golangci-lint v2
        run: |
          curl -sSfL https://github.com/golangci/golangci-lint/releases/download/v2.12.2/golangci-lint-2.12.2-linux-amd64.tar.gz | tar xzf - -C /usr/local/bin/ --strip-components=1 golangci-lint-2.12.2-linux-amd64/golangci-lint
          golangci-lint --version
      - name: Run linter
        run: golangci-lint run --timeout=5m ./...
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Install envtest binaries
        run: |
          go install sigs.k8s.io/controller-runtime/tools/setup-envtest@latest
          ENVTEST_DIR=$(setup-envtest use 1.31.0 -p path --bin-dir /usr/local/kubebuilder/bin 2>/dev/null || setup-envtest use 1.31.0 -p path || echo "")
          echo "KUBEBUILDER_ASSETS=$ENVTEST_DIR" >> $GITHUB_ENV
      - name: Run unit tests
        run: go test -v -race -coverprofile=coverage.out ./...
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true
      - name: Build controller
        run: go build -ldflags="-s -w" -trimpath -o bin/controller ./cmd/main.go
      - name: Build agent
        run: go build -ldflags="-s -w" -trimpath -o bin/agent ./cmd/agent/main.go
