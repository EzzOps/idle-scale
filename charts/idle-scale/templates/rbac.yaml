{{- if .Values.rbac.create -}}
# Controller ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idle-scale-controller
  namespace: idle-scale-system
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idle-scale-controller
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status"]
    verbs: ["get", "list", "watch", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idle-scale-controller
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idle-scale-controller
subjects:
  - kind: ServiceAccount
    name: idle-scale-controller
    namespace: idle-scale-system
---
# Agent ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: idle-scale-agent
  namespace: idle-scale-system
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: idle-scale-agent
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: idle-scale-agent
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: idle-scale-agent
subjects:
  - kind: ServiceAccount
    name: idle-scale-agent
    namespace: idle-scale-system
{{- end -}}
