apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-idle-scale-controller
  namespace: idle-scale-system
  labels:
    {{- include "idle-scale.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.controller.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: idle-scale
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idle-scale
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      serviceAccountName: idle-scale-controller
      containers:
        - name: controller
          image: "{{ .Values.controller.image.repository }}:{{ .Values.controller.image.tag }}"
          imagePullPolicy: {{ .Values.controller.image.pullPolicy }}
          resources:
            requests:
              cpu: 50m
              memory: 50Mi
